
name: Build Waraa Alhikaya APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project if ZIP exists
        run: |
          if [ -f waraa_alhikaya_android_project.zip ]; then
            unzip -o waraa_alhikaya_android_project.zip
          fi

      - name: Build APK
        run: gradle -p waraa_alhikaya_android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Waraa-Alhikaya-APK
          path: waraa_alhikaya_android/app/build/outputs/apk/debug/app-debug.apk
